apiVersion: apps/v1
kind: Deployment
metadata:
  name: arp-kube-state-metrics
  labels:
    {{- include "arp-phase9.labels" . | nindent 4 }}
    app.kubernetes.io/name: arp-kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arp-kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arp-kube-state-metrics
    spec:
      serviceAccountName: arp-kube-state-metrics
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: {{ .Values.kubeStateMetrics.image | quote }}
          args:
            - --resources=deployments,namespaces,nodes,pods,replicasets
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
          resources:
            {{- toYaml .Values.kubeStateMetrics.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: arp-kube-state-metrics
  labels:
    {{- include "arp-phase9.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: arp-kube-state-metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
