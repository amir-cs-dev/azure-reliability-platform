apiVersion: apps/v1
kind: Deployment
metadata:
  name: arp-prometheus
  labels:
    {{- include "arp-phase9.labels" . | nindent 4 }}
    app.kubernetes.io/name: arp-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arp-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arp-prometheus
    spec:
      serviceAccountName: arp-prometheus
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image | quote }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            {{- toYaml .Values.prometheus.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: config
              mountPath: /etc/prometheus/rules/arp-rules.yml
              subPath: arp-rules.yml
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: arp-prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: arp-prometheus
  labels:
    {{- include "arp-phase9.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: arp-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arp-alertmanager
  labels:
    {{- include "arp-phase9.labels" . | nindent 4 }}
    app.kubernetes.io/name: arp-alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arp-alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arp-alertmanager
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: {{ .Values.alertmanager.image | quote }}
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            {{- toYaml .Values.alertmanager.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
              readOnly: true
            - name: webhook
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: arp-alertmanager-config
        - name: webhook
          secret:
            secretName: {{ .Values.alertmanager.webhookSecretName }}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: arp-alertmanager
  labels:
    {{- include "arp-phase9.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: arp-alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arp-grafana
  labels:
    {{- include "arp-phase9.labels" . | nindent 4 }}
    app.kubernetes.io/name: arp-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arp-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arp-grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: {{ .Values.grafana.image | quote }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD__FILE
              value: /etc/grafana/secrets/admin-password
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboard-provider.yml
              subPath: dashboard-provider.yml
              readOnly: true
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards/reliability.json
              subPath: reliability.json
              readOnly: true
            - name: admin
              mountPath: /etc/grafana/secrets
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: provisioning
          configMap:
            name: arp-grafana-provisioning
        - name: dashboard
          configMap:
            name: arp-grafana-dashboard
        - name: admin
          secret:
            secretName: {{ .Values.grafana.adminSecretName }}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: arp-grafana
  labels:
    {{- include "arp-phase9.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: arp-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
