apiVersion: v1
kind: ServiceAccount
metadata:
  name: arp-prometheus
  labels:
    {{- include "arp-phase9.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arp-prometheus-discovery
  labels:
    {{- include "arp-phase9.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arp-prometheus-discovery
  labels:
    {{- include "arp-phase9.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: arp-prometheus
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arp-prometheus-discovery
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arp-kube-state-metrics
  labels:
    {{- include "arp-phase9.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-arp-kube-state-metrics
  labels:
    {{- include "arp-phase9.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes", "pods"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-arp-kube-state-metrics
  labels:
    {{- include "arp-phase9.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: arp-kube-state-metrics
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-arp-kube-state-metrics
