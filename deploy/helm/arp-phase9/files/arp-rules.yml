groups:
  - name: arp-reliability
    rules:
      - alert: ArpApplicationTargetDown
        expr: up{job="arp-api"} == 0
        for: 30s
        labels:
          severity: critical
          service: arp-api
        annotations:
          summary: Azure Reliability Platform scrape target is unavailable
          description: Prometheus has been unable to scrape an arp-api pod for 30 seconds.
          runbook_url: https://github.com/amir-cs-dev/azure-reliability-platform/blob/main/docs/phase9/runbook.md

      - alert: ArpApplicationHealthEndpointFailing
        expr: sum(increase(arp_http_requests_total{job="arp-api",path="/health",status_code=~"5.."}[1m])) > 0
        for: 15s
        labels:
          severity: warning
          service: arp-api
        annotations:
          summary: Azure Reliability Platform health endpoint is returning errors
          description: At least one HTTP 5xx health response was measured in the last minute.
          runbook_url: https://github.com/amir-cs-dev/azure-reliability-platform/blob/main/docs/phase9/runbook.md
