global:
  resolve_timeout: 1m

route:
  receiver: existing-discord
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 30m

receivers:
  - name: existing-discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/webhook-url
        send_resolved: true
        title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }} - {{ .Annotations.description }}{{ end }}'
