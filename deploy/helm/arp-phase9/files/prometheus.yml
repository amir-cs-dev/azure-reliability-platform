global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/arp-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [arp-alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]

  - job_name: arp-api
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [arp-phase9]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: arp-api
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        action: keep
        regex: http

  - job_name: kube-state-metrics
    static_configs:
      - targets: [arp-kube-state-metrics:8080]
