name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arp_ci
          POSTGRES_PASSWORD: ci_only_local_password
          POSTGRES_DB: arp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arp_ci -d arp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_TEST_DATABASE_URL: postgresql://arp_ci:ci_only_local_password@127.0.0.1:5432/arp_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r azure_function/requirements.txt
          python -m pip install pytest requests httpx 'psycopg[binary]>=3.2,<4'

      - name: Run all tests, including PostgreSQL integration
        run: python -m pytest tests/ -q

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.3"

      - name: Validate Terraform without accessing remote state
        run: |
          terraform fmt -check -recursive infra/app
          terraform -chdir=infra/app init -backend=false -input=false
          terraform -chdir=infra/app validate

      - name: Build Azure Function source package
        run: |
          python scripts/build_function_package.py \
            --output /tmp/arp-function.zip
          python -m zipfile --list /tmp/arp-function.zip

      - name: Build application Docker image
        run: docker build -t reliability-platform:ci .

      - name: Build monitor Docker image
        run: docker build -f Dockerfile.monitor -t reliability-monitor:ci .

      - name: Test application container health
        run: |
          docker run -d \
            --name reliability-ci \
            -p 127.0.0.1:8001:8000 \
            reliability-platform:ci

          for _ in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:8001/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs reliability-ci
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm -f reliability-ci || true
