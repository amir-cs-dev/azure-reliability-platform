name: Terraform apply reviewed plan

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: Successful Terraform plan workflow run ID for current main.
        required: true
        type: string
      confirmation:
        description: Type APPLY to approve the exact reviewed plan.
        required: true
        type: string

permissions: {}

concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  TF_VERSION: "1.16.3"
  INFRA_DIR: infra/app
  MAX_PLAN_AGE_SECONDS: "86400"
  PLAN_RUN_ID: ${{ inputs.plan_run_id }}
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_TERRAFORM_APPLY_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TERRAFORM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_TERRAFORM_SUBSCRIPTION_ID }}
  TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
  TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Enforce explicit operator approval and main branch
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "APPLY" ]] || {
            echo "Refusing apply: confirmation must be exactly APPLY." >&2
            exit 1
          }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Refusing apply: workflow must be dispatched from main." >&2
            exit 1
          }
          [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "Refusing apply: plan run ID must be numeric." >&2
            exit 1
          }
          main_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha')
          [[ "$GITHUB_SHA" == "$main_sha" ]] || {
            echo "Refusing apply: dispatched SHA is not current main." >&2
            exit 1
          }
          echo "CURRENT_MAIN_SHA=$main_sha" >> "$GITHUB_ENV"
          echo "Operator $GITHUB_ACTOR explicitly approved plan run $PLAN_RUN_ID."

      - name: Verify successful plan run and retained artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_json=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID")
          jq -e \
            --arg sha "$CURRENT_MAIN_SHA" \
            '.name == "Terraform plan" and
             .path == ".github/workflows/terraform-plan.yml" and
             .status == "completed" and
             .conclusion == "success" and
             .head_branch == "main" and
             .head_sha == $sha and
             (.event == "push" or .event == "workflow_dispatch")' \
            <<< "$run_json" > /dev/null || {
              echo "Refusing apply: plan workflow identity/status/SHA is invalid." >&2
              exit 1
            }

          artifact_name="terraform-plan-$PLAN_RUN_ID"
          artifacts=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID/artifacts")
          artifact_count=$(jq \
            --arg name "$artifact_name" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
            <<< "$artifacts")
          [[ "$artifact_count" == 1 ]] || {
            echo "Refusing apply: exact unexpired plan artifact was not found." >&2
            exit 1
          }

      - name: Checkout exact current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Download exact reviewed plan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: terraform-plan-${{ inputs.plan_run_id }}
          path: ${{ runner.temp }}/terraform-plan
          repository: ${{ github.repository }}
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}

      - name: Set up exact Terraform version
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Require non-secret workflow configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID \
            TF_STATE_RESOURCE_GROUP TF_STATE_STORAGE_ACCOUNT; do
            test -n "${!name:-}" || {
              echo "Missing required repository variable: $name" >&2
              exit 1
            }
          done

      - name: Azure login with infrastructure apply identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Initialize exact remote state
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive "$INFRA_DIR"
          terraform -chdir="$INFRA_DIR" init -input=false \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT"
          terraform -chdir="$INFRA_DIR" validate
          terraform -chdir="$INFRA_DIR" state pull > "$RUNNER_TEMP/state-current.json"

      - name: Reject mismatched, tampered, or stale plan
        shell: bash
        env:
          BUNDLE_DIR: ${{ runner.temp }}/terraform-plan
        run: |
          set -euo pipefail
          terraform_version=$(terraform version -json | jq -r .terraform_version)
          infra_tree=$(git rev-parse "$CURRENT_MAIN_SHA:$INFRA_DIR")
          terraform -chdir="$INFRA_DIR" show -json \
            "$BUNDLE_DIR/plan.tfplan" > "$RUNNER_TEMP/plan-verified.json"
          python scripts/terraform_plan_artifact.py validate \
            --bundle-dir "$BUNDLE_DIR" \
            --plan-json "$RUNNER_TEMP/plan-verified.json" \
            --metadata "$BUNDLE_DIR/metadata.json" \
            --current-state "$RUNNER_TEMP/state-current.json" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$PLAN_RUN_ID" \
            --main-sha "$CURRENT_MAIN_SHA" \
            --terraform-version "$terraform_version" \
            --infra-tree "$infra_tree" \
            --max-age-seconds "$MAX_PLAN_AGE_SECONDS"

      - name: Apply exact reviewed binary plan
        shell: bash
        env:
          PLAN_FILE: ${{ runner.temp }}/terraform-plan/plan.tfplan
        run: |
          set -euo pipefail
          terraform -chdir="$INFRA_DIR" apply -input=false -auto-approve "$PLAN_FILE"

      - name: Record post-apply state identity
        if: success()
        shell: bash
        env:
          BUNDLE_DIR: ${{ runner.temp }}/terraform-plan
          EVIDENCE_DIR: ${{ runner.temp }}/terraform-apply-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          terraform -chdir="$INFRA_DIR" state pull > "$RUNNER_TEMP/state-after.json"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg apply_run_id "$GITHUB_RUN_ID" \
            --arg plan_run_id "$PLAN_RUN_ID" \
            --arg source_sha "$CURRENT_MAIN_SHA" \
            --arg operator "$GITHUB_ACTOR" \
            --arg operation "$(jq -r '.terraform.operation' "$BUNDLE_DIR/metadata.json")" \
            --arg applied_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg lineage "$(jq -r '.lineage' "$RUNNER_TEMP/state-after.json")" \
            --argjson serial "$(jq '.serial' "$RUNNER_TEMP/state-after.json")" \
            '{repository:$repository,apply_run_id:$apply_run_id,
              plan_run_id:$plan_run_id,source_sha:$source_sha,
              operator:$operator,confirmation:"APPLY",operation:$operation,
              applied_at:$applied_at,state:{lineage:$lineage,serial:$serial}}' \
            > "$EVIDENCE_DIR/apply-metadata.json"
          cp "$BUNDLE_DIR/metadata.json" "$EVIDENCE_DIR/plan-metadata.json"
          {
            echo "## Approved Terraform apply"
            echo
            echo "- Operator: \`$GITHUB_ACTOR\`"
            echo "- Reviewed plan run: \`$PLAN_RUN_ID\`"
            echo "- Exact main SHA: \`$CURRENT_MAIN_SHA\`"
            echo "- Operation: \`$(jq -r '.terraform.operation' "$BUNDLE_DIR/metadata.json")\`"
            echo "- Explicit confirmation: \`APPLY\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain apply evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-apply-${{ github.run_id }}
          path: ${{ runner.temp }}/terraform-apply-evidence/
          if-no-files-found: error
          retention-days: 30
