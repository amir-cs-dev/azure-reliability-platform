name: Deploy Azure applications

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arp-deployment
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Azure login with workload identity
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve existing registry
        shell: bash
        run: |
          set -euo pipefail
          ACR=$(az acr list --resource-group rg-arp-app-wus3 --query '[0].name' -o tsv)
          test -n "$ACR"
          echo "ACR=$ACR" >> "$GITHUB_ENV"
          echo "REGISTRY=$ACR.azurecr.io" >> "$GITHUB_ENV"
      - name: Build immutable application image
        shell: bash
        run: |
          set -euo pipefail
          docker build -t "$REGISTRY/reliability-api:$GITHUB_SHA" .
      - name: Push immutable application image to existing ACR
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR"
          docker push "$REGISTRY/reliability-api:$GITHUB_SHA"
      - name: Deploy existing API Container App
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update --resource-group rg-arp-app-wus3 --name ca-arp-api-wus3 --image "$REGISTRY/reliability-api:$GITHUB_SHA" -o none
      - name: Verify API deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_deploy.py
